services:
  mongo:
    image: mongo:7
    container_name: autopatch-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    networks:
      - autopatch-network

  nginx:
    image: nginx:alpine
    container_name: autopatch-nginx
    restart: unless-stopped
    ports:
      - "8081:8080"  # Port 8080 kullanımda olduğu için 8081'e map ediyoruz
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scanner-service
    networks:
      - autopatch-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Frontend'e erişim için

  scanner-service:
    build: .
    container_name: autopatch-scanner
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/autopatch-scanner-service
      - MOCK_CCE=true
      - CCE_ENDPOINT=
      - CCE_PROJECT_ID=
      - CCE_CLUSTER_ID=
      - CCE_TOKEN=
    ports:
      - "5000:5000"
    networks:
      - autopatch-network

networks:
  autopatch-network:
    driver: bridge


