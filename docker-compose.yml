version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: autopatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - autopatch-network

  nginx:
    image: nginx:alpine
    container_name: autopatch-nginx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mongo

  scanner-service:
    build: .
    container_name: autopatch-scanner
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/autopatch-scanner-service
      - MOCK_CCE=true
      - CCE_ENDPOINT=
      - CCE_PROJECT_ID=
      - CCE_CLUSTER_ID=
      - CCE_TOKEN=
    ports:
      - "5000:5000"
    networks:
      - autopatch-network

networks:
  autopatch-network:
    driver: bridge


